    and errors. Configure Ktor + Kotlinx Serialization, model the generateContent request/response DTOs and role/content mapping,
    add a ConnectivityChecker used before requests, and normalize auth/429/5xx/timeout/transport/protocol failures into an
    app-level ProviderFailure model while preserving cancellation. Use a Ktor test engine/fixtures so payloads and failures
    are deterministic.


