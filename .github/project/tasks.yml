- id: ARCH-001
  bundle: W4
  order: 1
  title: Introduce the application composition and domain boundaries
  scope: Mandatory
  priority: P0
  difficulty: 4
  owner: Martim Gomes
  reviewer: Miguel Alves
  dependencies:
  - M2-002
  - FLOW-001
  area: Architecture
  milestone: mentor_3
  requirements: REQ-001, REQ-003, REQ-005
  status: Backlog
  body: '## Outcome

    Create the minimum architecture needed for real services without over-engineering. Use DroidMentorApplication as the manual
    composition root/service locator; define interfaces such as ConversationRepository, SettingsRepository and MentorProvider
    plus only the focused use cases actually needed by current flows. Keep everything inside the single app module and package
    by responsibility rather than creating new Gradle modules.


    ## Planning

    - **Bundle:** `W4`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `4/5`

    - **Owner:** `Martim Gomes`

    - **Reviewer:** `Miguel Alves`


    ## Dependencies

    - `M2-002`

    - `FLOW-001`


    ## Likely package / path

    DroidMentorApplication.kt; domain/repository/; domain/usecase/; data/repository/


    ## Components / interfaces

    manual service locator, ConversationRepository, SettingsRepository, MentorProvider, core use cases


    ## Inputs → outputs

    Inputs: existing local UI/domain contracts. Outputs: injectable app services/interfaces consumed by presentation logic.


    ## Tests / verification

    Unit tests use simple fakes for interfaces; app startup resolves all dependencies; verify no Hilt/Dagger and no UI class
    imports Ktor/Room implementations directly.


    ## Done when

    Network and persistence can be added behind stable boundaries without restructuring the UI or creating extra modules.


    ## Requirements

    REQ-001, REQ-003, REQ-005

    '
  labels:
  - mandatory
  - architecture
- id: ARCH-002
  bundle: W4
  order: 2
  title: Move screen behavior to testable ViewModel/state contracts
  scope: Mandatory
  priority: P0
  difficulty: 4
  owner: Miguel Alves
  reviewer: Martim Gomes
  dependencies:
  - ARCH-001
  - FLOW-002
  - FLOW-003
  area: Architecture
  milestone: mentor_3
  requirements: REQ-013
  status: Backlog
  body: '## Outcome

    Replace temporary screen-local state where needed with immutable UI state and typed actions/events coordinated by ViewModels
    (or equivalent lifecycle-aware presentation controllers). Keep composables as renderers/event emitters. Consolidate reusable
