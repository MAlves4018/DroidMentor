- id: SETUP-001
  bundle: W0
  order: 1
  title: Establish the shared repository and project baseline
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Miguel Alves
  reviewer: Martim Gomes
  dependencies: []
  area: Repository & Planning
  milestone: mentor_1
  requirements: REQ-020, REQ-021, REQ-022
  status: Ready
  body: '## Outcome

    Set up the repository as the single shared workspace instead of splitting setup into separate microtasks. Confirm Miguel
    Alves (MAlves4018), Martim Gomes (MarsGomes) and the professor have the required access; keep the GitHub Project linked;
    create the durable README structure and initial project metadata in the same pass. The README should explain what DroidMentor
    is, who is building it, the technology stack, how to build/run it and where milestone evidence will live, without referring
    to temporary handovers or internal planning versions.


    ## Planning

    - **Bundle:** `W0`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Miguel Alves`

    - **Reviewer:** `Martim Gomes`


    ## Dependencies

    None.


    ## Likely package / path

    Repository root; README.md; .github/; GitHub repository/project settings


    ## Components / interfaces

    Repository access, README structure, team section, project link, issue/PR templates if retained


    ## Inputs → outputs

    Inputs: assignment requirements + GitHub accounts. Outputs: shared repository with correct access and a durable entry-point
    README.


    ## Tests / verification

    Verify both students can clone/push; professor access is correct; README names Miguel Alves (MAlves4018) and Martim Gomes
    (MarsGomes) with placeholders for student number/email until filled; no dependency on external intermediate documents.


    ## Done when

    A new contributor can open the repo, understand the project and collaborate without additional setup notes. Repository/access/README
    work is complete as one coherent setup result.


    ## Requirements

    REQ-020, REQ-021, REQ-022

    '
  labels:
  - mandatory
