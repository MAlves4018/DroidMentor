- id: UI-001
  bundle: W1
  order: 1
  title: Establish the shared Compose design system and reusable interaction primitives
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Martim Gomes
  reviewer: Miguel Alves
  dependencies:
  - SETUP-002
  area: UI
  milestone: mentor_2
  requirements: REQ-013
  status: Backlog
  body: '## Outcome

    Create a small shared UI foundation before building individual screens so common visual and interaction patterns are implemented
    once rather than being credited to one feature page. Define the theme tokens and reusable composables that will genuinely
    appear in two or more screens: a common scaffold/header pattern, primary actions, an async submit/request action with
    disabled and loading states, text-field variants, icon actions, and consistent loading/error/empty feedback. Keep these
    composables presentation-only: they receive state and callbacks and must not know about navigation, Gemini, Room or DataStore.
    Add previews/examples showing normal, disabled, loading and error states, but avoid abstract components that have no concrete
    use in W1.


    ## Planning

    - **Bundle:** `W1`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Martim Gomes`

    - **Reviewer:** `Miguel Alves`


    ## Dependencies

    - `SETUP-002`


    ## Likely package / path

    app/src/main/java/isel/dei/pdm/droidmentor/ui/components/; ui/theme/


    ## Components / interfaces

    DroidMentorScaffold, AppHeader, PrimaryActionButton, AsyncSubmitButton, AppTextField/SecureTextField, IconActionButton,
    InlineError/Loading/Empty feedback, spacing/typography tokens


    ## Inputs → outputs

    Inputs: immutable visual state, labels/content and typed callbacks. Outputs: reusable composables with stable semantics
    that screen tasks can compose without duplicating styling or async-action behavior.


    ## Tests / verification

    Create previews for the shared states and focused Compose tests for enabled/disabled actions, loading behavior, header
    slots, field semantics and visible error/empty feedback. Verify shared components do not access repositories, navigation
    controllers or provider objects directly.


    ## Done when

    Active Chat, History, Title, Settings and About can be built from the same visual primitives without copy-pasting common
    headers/buttons/feedback patterns, and the shared components remain backend-agnostic.


    ## Requirements

    REQ-013

    '
  labels:
  - mandatory
  - ui
- id: UI-002
  bundle: W1
  order: 2
  title: Implement the Active Chat page UI
  scope: Mandatory
  priority: P0
  difficulty: 5
  owner: Miguel Alves
  reviewer: Martim Gomes
  dependencies:
  - UI-001
  area: UI
  milestone: mentor_2
  requirements: REQ-013, REQ-016
  status: Backlog
  body: '## Outcome

    Implement the Active Chat Compose surface independently from Gemini and persistence, using the shared W1 design primitives
    instead of redefining common headers/buttons/states. The page should render an ordered conversation with visually distinct
    user/model turns, a multiline composer, a submit/send action, an edit entry point on eligible messages, an attachment
    entry point, and explicit sending/loading/error states. Define screen-specific reusable components such as MessageBubble
    and ChatComposer because they carry chat semantics. Model the screen through immutable state and typed actions so previews
    and tests can reproduce empty, populated, sending and failure states. Edit/Add/Send controls may emit events before their
    real backend behavior exists.


    ## Planning

    - **Bundle:** `W1`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `5/5`

    - **Owner:** `Miguel Alves`

    - **Reviewer:** `Martim Gomes`


    ## Dependencies

    - `UI-001`


    ## Likely package / path

    app/src/main/java/isel/dei/pdm/droidmentor/ui/chat/


    ## Components / interfaces

    ActiveChatScreen, ActiveChatUiState, ActiveChatAction, MessageList, MessageBubble, ChatComposer, EditMessageAction, AddAttachmentAction;
    reuse AppHeader and AsyncSubmitButton from UI-001


    ## Inputs → outputs

    Inputs: immutable ActiveChatUiState with messages, draft, sending/error flags and eligible actions. Outputs: typed UI
    events such as DraftChanged, SendClicked, EditMessageClicked(messageId), AddAttachmentClicked and RetryClicked.


    ## Tests / verification

    Compose previews cover empty, populated, sending and error states. UI tests prove message order/role styling, empty-send
    disabled behavior, draft entry, send action emission, edit control visibility for eligible messages, attachment action
    emission and loading/error feedback. Verify provider/database logic is absent from composables.


    ## Done when

    Active Chat can be exercised entirely with fake state, already exposes the controls required by later functionality, and
    later Gemini/Room/branching work can connect through state/actions without redesigning the page.


    ## Requirements

    REQ-013, REQ-016

    '
  labels:
  - mandatory
  - ui
- id: UI-003
  bundle: W1
  order: 3
  title: Implement the Chat History page UI
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Martim Gomes
  reviewer: Miguel Alves
  dependencies:
  - UI-001
  area: UI
  milestone: mentor_2
  requirements: REQ-013, REQ-015
  status: Backlog
  body: '## Outcome

    Implement Chat History as its own meaningful screen result, reusing the shared scaffold/header/action/feedback components
    from UI-001 instead of repeating work from Active Chat. Render conversation summaries with title and last activity, provide
    open/delete actions, and reserve a clear search/organization area so later search/rename/pin functionality can be added
    without redesign. Keep data fake/local at this stage; the page should emit typed actions and should not know whether conversations
    eventually come from memory or Room.


    ## Planning

    - **Bundle:** `W1`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Martim Gomes`

    - **Reviewer:** `Miguel Alves`


    ## Dependencies

    - `UI-001`


    ## Likely package / path

    app/src/main/java/isel/dei/pdm/droidmentor/ui/history/


    ## Components / interfaces

    ChatHistoryScreen, HistoryUiState, HistoryAction, ConversationList, ConversationRow, HistorySearchField/organization slot,
    DeleteConversationAction; reuse AppHeader/feedback primitives from UI-001


    ## Inputs → outputs

    Inputs: HistoryUiState containing conversation summaries, loading/empty/error state and optional query placeholder. Outputs:
    OpenConversation(id), DeleteConversation(id), SearchChanged(query) and future organization events.


    ## Tests / verification

    Compose tests prove summaries render in supplied order, empty/loading/error states are visible, open/delete emit the correct
    conversation ID, and the search/organization area can be shown without database logic. Verify common header/action styling
    comes from UI-001 rather than duplicated composables.


    ## Done when

    History can be previewed and tested with fake summaries, exposes the interactions needed for routing/lifecycle work, and
    later Room/search integration can replace the data source without restructuring the UI.


    ## Requirements

    REQ-013, REQ-015

    '
  labels:
