- id: SETUP-002
  bundle: W0
  order: 2
  title: Create and verify the Android application baseline
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Martim Gomes
  reviewer: Miguel Alves
  dependencies:
  - SETUP-001
  area: Repository & Planning
  milestone: mentor_1
  requirements: REQ-001, REQ-003
  status: Backlog
  body: '## Outcome

    Create the smallest buildable Android/Kotlin baseline that later tasks can extend. Keep a single :app module, DroidMentorApplication,
    MainActivity and the Compose/theme skeleton. Kotlin source files may remain under app/src/main/java/isel/dei/pdm/droidmentor
    because that is a standard Android source set name; do not rename it just to say ''kotlin''. Avoid Hilt/Dagger and avoid
    adding libraries that are not yet needed.


    ## Planning

    - **Bundle:** `W0`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Martim Gomes`

    - **Reviewer:** `Miguel Alves`


    ## Dependencies

    - `SETUP-001`


    ## Likely package / path

    app/; app/src/main/java/isel/dei/pdm/droidmentor/; build.gradle.kts; settings.gradle.kts


    ## Components / interfaces

    DroidMentorApplication, MainActivity, Compose theme/root surface, Gradle configuration


    ## Inputs → outputs

    Inputs: clean repository. Outputs: app that syncs, builds and launches to a minimal Compose surface.


    ## Tests / verification

    Run Gradle sync, assembleDebug and one basic unit/instrumented smoke test; launch on the agreed emulator/device; verify
    no unused DI or extra modules were introduced.


    ## Done when

    Both students can open the project in Android Studio and run the same baseline successfully.


    ## Requirements

    REQ-001, REQ-003

    '
