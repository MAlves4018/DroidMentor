- id: FLOW-001
  bundle: W2
  order: 1
  title: Wire application routing and conversation selection
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Martim Gomes
  reviewer: Miguel Alves
  dependencies:
  - UI-002
  - UI-003
  - UI-004
  area: Navigation & Local Chat
  milestone: mentor_2
  requirements: REQ-013
  status: Backlog
  body: '## Outcome

    Connect the five required screens through one coherent navigation result, using the actions already exposed by the W1
    UIs. Define stable route arguments around ConversationId rather than passing mutable screen objects. Title must open new-chat/history/settings/about
    destinations; History must open a selected conversation; Active Chat must preserve conversation identity across back navigation.
    Keep routing separate from repository/provider implementation so later Room/Gemini work can replace data sources without
    changing destinations.


    ## Planning

    - **Bundle:** `W2`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Martim Gomes`

    - **Reviewer:** `Miguel Alves`


    ## Dependencies

    - `UI-002`

    - `UI-003`

    - `UI-004`


    ## Likely package / path

    navigation/; domain/model/identity/; ui/*


    ## Components / interfaces

    typed route definitions, NavHost/navigation coordinator, ConversationId, destination resolver/back-stack rules


    ## Inputs → outputs

    Inputs: navigation actions from Title/History/Active Chat and selected ConversationId. Outputs: deterministic destination/back-stack
    state and stable conversation identity passed to the receiving screen.


    ## Tests / verification

    Navigation tests cover Title -> new Active Chat, Title -> History/Settings/About, History row -> selected Active Chat
    and sensible back behavior. Verify routing passes stable IDs only and creating/opening one conversation cannot accidentally
    replace another.


    ## Done when

    Every required screen is reachable through the intended user path and History can select a conversation for Active Chat
    without coupling navigation to in-memory/Room/Gemini implementations.


    ## Requirements

    REQ-013

    '
  labels:
  - mandatory
  - ui
- id: FLOW-002
  bundle: W2
  order: 2
  title: Implement local Active Chat interaction and conversation state
  scope: Mandatory
  priority: P0
  difficulty: 4
  owner: Miguel Alves
  reviewer: Martim Gomes
  dependencies:
  - UI-002
  - FLOW-001
  area: Navigation & Local Chat
  milestone: mentor_2
  requirements: REQ-007, REQ-008, REQ-013, REQ-016
  status: Backlog
  body: '## Outcome

    Turn the Active Chat UI into a real local state machine before Gemini or Room are introduced. Define the domain conversation/message
    model required by chat behavior, including stable IDs, deterministic order and explicit user/model roles. Handle draft
    changes, valid local sends, duplicate-send protection and the mandatory edit/rewrite rule against in-memory state. Keep
    the same state/action boundary from UI-002 so later provider/persistence integration replaces effects rather than rewriting
    the composables.


    ## Planning

    - **Bundle:** `W2`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `4/5`

    - **Owner:** `Miguel Alves`

    - **Reviewer:** `Martim Gomes`


    ## Dependencies

    - `UI-002`

    - `FLOW-001`


    ## Likely package / path

    domain/model/; domain/chat/; ui/chat/


    ## Components / interfaces

    Conversation, Message, Role, ActiveChatViewModel/reducer/state holder, local send operation, edit/rewrite operation


    ## Inputs → outputs

    Inputs: typed ActiveChatAction events and selected ConversationId. Outputs: immutable ActiveChatUiState, ordered local
    messages and explicit one-shot effects/errors where needed.


    ## Tests / verification

    Pure/state tests cover stable IDs, deterministic order/roles, draft changes, empty send rejection, repeated-send guard,
    user-message insertion, edit of first/middle/latest eligible user messages and suffix replacement without touching unrelated
    conversations.


    ## Done when

    Active Chat behaves correctly against local/fake data and exposes stable conversation/message contracts that Gemini and
    Room can implement later.


    ## Requirements

    REQ-007, REQ-008, REQ-013, REQ-016

    '
  labels:
  - mandatory
  - ui
- id: FLOW-003
  bundle: W2
  order: 3
  title: 'Implement local History lifecycle: new, open, delete and resume'
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Martim Gomes
  reviewer: Miguel Alves
  dependencies:
  - UI-003
  - FLOW-001
  - FLOW-002
  area: Navigation & Local Chat
  milestone: mentor_2
  requirements: REQ-014, REQ-015
  status: Backlog
  body: '## Outcome

    Complete the local conversation lifecycle around Title/History/Active Chat. Define how a new conversation becomes active,
    how History opens one, how delete updates the list/active selection, and what the app should try to resume on startup.
    Keep storage in memory for now, but put the behavior behind a small repository/state boundary so Room can replace it later
    without rewriting screen logic.


    ## Planning

    - **Bundle:** `W2`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Martim Gomes`

    - **Reviewer:** `Miguel Alves`


    ## Dependencies

    - `UI-003`

    - `FLOW-001`

    - `FLOW-002`


    ## Likely package / path

    domain/repository/; ui/history/; navigation/; data/inmemory/


    ## Components / interfaces

    temporary in-memory ConversationRepository, History state holder, active-conversation resolver, new/open/delete/resume
    operations


    ## Inputs → outputs

    Inputs: new/open/delete/startup events. Outputs: active conversation ID, history list and safe fallback destination.


    ## Tests / verification

    Tests cover multiple conversations, delete only target chat, deleting the active chat, opening a missing chat, startup
    with valid/missing/no active conversation and History refresh after changes.


    ## Done when

    The complete mandatory local lifecycle is demonstrable before adding Room, with semantics already fixed for the persistence
    task.


    ## Requirements

    REQ-014, REQ-015

    '
  labels:
  - mandatory
  - ui
