- id: UI-004
  bundle: W1
  order: 4
  title: Implement the Title, Settings and About page UIs
  scope: Mandatory
  priority: P0
  difficulty: 3
  owner: Miguel Alves
  reviewer: Martim Gomes
  dependencies:
  - UI-001
  area: UI
  milestone: mentor_2
  requirements: REQ-006, REQ-013
  status: Backlog
  body: '## Outcome

    Build the three simpler required surfaces as one task because they do not justify separate execution units. Title should
    expose the main entry actions (new chat, history, settings, about); Settings should provide a masked/revealable Gemini
    API-key field with Save/Remove actions and a reserved provider-capability/reasoning area; About should present durable
    project/team information. Reuse the shared header, buttons, fields and feedback patterns from UI-001. At this stage controls
    emit events only: navigation is wired in FLOW-001, API-key persistence in NET-002 and reasoning capability in RSN-001.


    ## Planning

    - **Bundle:** `W1`

    - **Scope:** `Mandatory`

    - **Priority:** `P0`

    - **Difficulty:** `3/5`

    - **Owner:** `Miguel Alves`

    - **Reviewer:** `Martim Gomes`


    ## Dependencies

    - `UI-001`


    ## Likely package / path

    app/src/main/java/isel/dei/pdm/droidmentor/ui/title/; ui/settings/; ui/about/


    ## Components / interfaces

    TitleScreen/State/Action, SettingsScreen/State/Action, AboutScreen, home destination actions, ApiKeyField, Save/Remove
    actions, provider capability slot, project/team info sections


    ## Inputs → outputs

    Inputs: static project/team content plus SettingsUiState/API-key draft. Outputs: NewChat/History/Settings/About navigation
    intents and ApiKeyChanged/SaveKey/RemoveKey/provider-option actions.


    ## Tests / verification

    Compose tests cover presence of all Title destinations, masked/revealed key input, Save/Remove action emission, configured/unconfigured
    Settings states and durable About/team content. Verify these screens reuse UI-001 primitives and contain no navigation,
    DataStore or provider implementation.


    ## Done when

    All three screens are concrete and testable UI surfaces, their later routing/settings/reasoning integrations have stable
    action contracts, and no separate microtasks are needed for their individual buttons or text sections.


    ## Requirements

    REQ-006, REQ-013

    '
